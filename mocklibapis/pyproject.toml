[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocklibapis"
version = "1.0.0"
description = "Mock Library API server for Python automation learning labs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
mocklibapis = "mocklibapis.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
