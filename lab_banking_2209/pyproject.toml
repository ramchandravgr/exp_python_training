[project]
name = "lab-banking-2209"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "logging>=0.4.9.6",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

# Relaxed temporarily for training — re-enable stricter rules later.
[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F"]
extend-ignore = ["E501"]

[tool.ruff.format]
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
